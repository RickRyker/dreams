name: Fullstack Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Environment to deploy"
        options:
          - dev
          - test
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.0
          cache: "npm"

      - name: Set minimum npm version
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Build all packages
        run: npx tsc -b

      # -------------------------
      # CLIENT BUILD + DEPLOY
      # -------------------------
      - name: Build client
        working-directory: client
        run: npm run build

      - name: Deploy UI to S3
        working-directory: client
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          UI_BUCKET: ${{ secrets.UI_BUCKET }}
        run: |
          aws s3 sync dist s3://$UI_BUCKET --delete

      # -------------------------
      # SERVER BUILD
      # -------------------------
      - name: Build server
        working-directory: server
        run: npm run build

      # Server code is deployed as Lambda functions bundled directly from
      # server/src/** by the CDK stacks below (AuthStack, EmailQueueStack,
      # MaintenanceStack); there is no standalone "server deploy" step.

      # -------------------------
      # CDK DEPLOY
      # -------------------------
      - name: Install CDK
        run: npm install -g aws-cdk

      - name: CDK Deploy
        working-directory: infrastructure
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CDK_ACCOUNT: ${{ secrets.CDK_ACCOUNT }}
          CDK_REGION: ${{ secrets.CDK_REGION }}
        run: cdk deploy --all --require-approval never

name: Deploy Server and UI

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build shared/server/client
        run: npx tsc -b

      - name: Build client UI
        working-directory: client
        run: npm run build

      - name: Build server bundle
        working-directory: server
        run: npm run build

      # -------------------------
      # SERVER DEPLOY (customize)
      # -------------------------
      - name: Deploy server
        working-directory: server
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
        run: |
          # Example: Lambda deploy
          npm run deploy

      # -------------------------
      # UI DEPLOY (customize)
      # -------------------------
      - name: Deploy UI
        working-directory: client
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
        run: |
          # Example: S3 + CloudFront
          npm run deploy
